<nav class="navbar navbar-expand-lg navbar-dark shadow-lg">
    <div class="container">
        <!-- Brand/Logo -->
        <a class="navbar-brand fw-bold" href="/">
            <i class="fas fa-briefcase me-2"></i>JobSage
        </a>

        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation items -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item me-3">
                    <a class="nav-link" href="{% url 'home-page' %}">
                        <i class="fas fa-home me-1"></i>Home
                    </a>
                </li>
                <li class="nav-item me-3">
                    <a class="nav-link" href="{% url 'resume-page' %}">
                        <i class="fas fa-code me-1"></i>Resume
                    </a>
                </li>
                <li class="nav-item me-3">
                    <a class="nav-link" href="{% url 'system-design-page' %}">
                        <i class="fas fa-microphone me-1"></i>System Design
                    </a>
                </li>
                <li class="nav-item me-3">
                    <a class="nav-link" href="{% url 'smart-prep' %}">
                        <i class="fas fa-book me-1"></i>Smart Prep
                    </a>
                </li>
                
                <li class="nav-item me-3">
                    <a class="nav-link" href="{% url 'about-page' %}">
                        <i class="fas fa-chart-line me-1"></i>About Us
                    </a>
                </li>
            </ul>

            <!-- User authentication section -->
            <ul class="navbar-nav">
                {% if user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" 
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle me-1"></i>{{ user.username }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="fas fa-user me-2"></i>Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="fas fa-cog me-2"></i>Settings
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" href="{% url 'logout-page' %}">
                                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                                </a>
                            </li>
                        </ul>
                    </li>
                {% else %}
                    <li class="nav-item me-2">
                        <a class="nav-link" href="{% url 'login-page' %}">
                            <i class="fas fa-sign-in-alt me-1"></i>Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light px-3" href="{% url 'signup-page' %}">
                            <i class="fas fa-user-plus me-1"></i>Sign Up
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<script>
    // Add scroll effect to navbar
    window.addEventListener('scroll', function() {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // Add active state to current page
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also highlight the parent dropdown
                const dropdown = link.closest('.dropdown');
                if (dropdown) {
                    dropdown.querySelector('.dropdown-toggle').classList.add('active');
                }
            }
        });
    });
</script>
